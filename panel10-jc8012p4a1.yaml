# ESP Screens - a Guition ESP32-S3-4848S040 (4-inch EU wallbox) built from this checkout: the bench and the
# manual route (README_EXTENDED.md, docs/GUITION.md).
#
# The screen is two packages: packages/core.yaml, which every board shares (the LVGL tree, the cards, the
# scripts, the entities), and packages/boards/panel10-jc8012p4a1.yaml with this board's hardware and sizes.
# docs/PROFILES.md says how the files fit together. A screen installed from ESP Screens builds the same two
# files over GitHub through packages/guition.yaml; this file only adds what a build from a checkout needs:
# the secrets (api_encryption_key, ota_password, Wi-Fi) from secrets.yaml and the components of this checkout.
substitutions:
  FONT_DIR: "fonts"                                # the fonts next to this file

packages:
  core: !include packages/core.yaml
  board: !include packages/boards/panel10-jc8012p4a1.yaml

# The components of this checkout; packages/guition.yaml takes them from GitHub.
external_components:
  - source:
      type: local
      path: components
    components: [smart_display, gsl3680]

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Mains-powered panel: no modem sleep, so HA updates and OTA arrive without beacon latency.
  power_save_mode: none
  ap:
    ssid: "Smartdisplay Fallback Hotspot"
    password: !secret ap_password

captive_portal:
