        # ---------- VALUE SLIDER OVERLAY ----------
        # ---------- PAGE NAVIGATION: the band under the tiles ----------
        # Each half of the band is one key (firmware 0.2.69+): a chevron in its corner, lit up under a finger, and the
        # page dots between them. The band reaches from the tile area's end (SCROLL_Y + SCROLL_H) to the bottom edge.
        - obj:
            id: page_prev
            align: BOTTOM_LEFT
            x: 0
            y: 0
            width: ${PAGE_KEY_W}
            height: ${PAGE_BAR_H}
            pad_all: 0
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            pressed:
              styles: paint_page_pressed
              bg_opa: COVER
            # on_click: LVGL sends no short click after a press of 400 ms, so a firm or slow press did nothing
            # (firmware 0.2.65+). The bar has no hold of its own; accept_repeat still drops bounce and a swipe.
            on_click:
              - if:
                  condition:
                    lambda: 'return cyd::touch_guard.accept_repeat(millis(), 11);'
                  then:
                    - lambda: 'id(tile_page) = std::max(0, id(tile_page) - 1);'
                    - script.execute: show_tile_page
            widgets:
              - label:
                  align: LEFT_MID
                  x: ${PAGE_CHEVRON_INSET}
                  text: "\U000F0141" # chevron-left
                  text_font: materialdesign_icons_mini
                  styles: paint_ink
                  clickable: false
        - obj:
            id: page_number
            align: BOTTOM_MID
            y: 0
            width: ${PAGE_NUMBER_W}
            height: ${PAGE_BAR_H}
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            clickable: false
            scrollable: false
        - obj:
            id: page_next
            align: BOTTOM_RIGHT
            x: 0
            y: 0
            width: ${PAGE_KEY_W}
            height: ${PAGE_BAR_H}
            pad_all: 0
            radius: 0
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            pressed:
              styles: paint_page_pressed
              bg_opa: COVER
            on_click:
              - if:
                  condition:
                    lambda: 'return cyd::touch_guard.accept_repeat(millis(), 12);'
                  then:
                    - lambda: 'id(tile_page) += 1;'
                    - script.execute: show_tile_page
            widgets:
              - label:
                  align: RIGHT_MID
                  x: -${PAGE_CHEVRON_INSET}
                  text: "\U000F0142" # chevron-right
                  text_font: materialdesign_icons_mini
                  styles: paint_ink
                  clickable: false

        - obj:
            id: brightness_overlay
            x: 0
            y: 0
            width: ${DISPLAY_W}
            height: ${DISPLAY_H}
            bg_opa: TRANSP
            hidden: true
            scrollable: false
            scrollbar_mode: 'OFF'
            pad_left: 0
            pad_right: 0
            pad_top: 0
            pad_bottom: 0
            border_width: 0
            widgets:
