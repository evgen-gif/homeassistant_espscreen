              - obj:
                  id: brightness_overlay_dim
                  x: 0
                  y: 0
                  width: ${DISPLAY_W}
                  height: ${DISPLAY_H}
                  styles: paint_veil
                  bg_opa: 18%
                  border_width: 0
                  clickable: false
                  scrollable: false

              - obj:
                  id: overlay_back_button
                  align: TOP_LEFT
                  x: ${CARD_KEY_X}
                  y: ${CARD_KEY_Y}
                  width: ${CARD_KEY_SIZE}
                  height: ${CARD_KEY_SIZE}
                  radius: 999
                  styles: paint_key
                  bg_opa: COVER
                  border_width: 0
                  clickable: true
                  scrollable: false
                  on_click:
                    - script.execute: close_cards
                  widgets:
                    - label:
                        align: CENTER
                        text: "\U000F004D"
                        text_font: materialdesign_icons_mini
                        clickable: false

              - label:
                  id: overlay_title
                  align: TOP_MID
                  y: ${OVERLAY_TITLE_Y}
                  text: "Light"
                  styles: style_room

              - label:
                  id: overlay_value
                  align: TOP_MID
                  y: ${OVERLAY_VALUE_Y}
                  text: "100 %"
                  styles: style_value_big

              - slider:
                  id: overlay_slider
                  align: CENTER
                  y: ${OVERLAY_SLIDER_Y}
                  width: ${OVERLAY_SLIDER_W}
                  height: ${OVERLAY_SLIDER_H}
                  min_value: 0
                  max_value: 100
                  value: 100
                  adv_hittest: false

                  styles: paint_accent_tint
                  bg_opa: 100%
                  radius: ${OVERLAY_SLIDER_RADIUS}
                  # The only widget with BOTH a radius AND a child (overlay_icon).
                  # LVGL then clips children to the rounding, and that's only
                  # possible via a contiguous 96x160 = 46KB ARGB layer.
                  # If that allocation fails, LVGL keeps trying until the
                  # task watchdog restarts the board. The rounding stays, the
                  # clipping goes.
                  clip_corner: false
                  border_width: 0

                  indicator:
                    styles: paint_accent_bright
                    bg_opa: 100%
                    radius: ${OVERLAY_SLIDER_RADIUS}

                  knob:
                    bg_opa: 0%
                    border_width: 0
                    shadow_width: 0
                    pad_all: ${OVERLAY_KNOB_PAD}

                  on_value:
                    - script.execute:
                        id: slider_preview
                        value: !lambda "return x;"

                  on_release:
                    - script.execute:
                        id: slider_commit
                        value: !lambda "return lv_slider_get_value(id(overlay_slider));"


              # The icon used to be a CHILD in the slider. A widget with a radius
              # and children has to clip those children to the rounding, and
              # LVGL can only do that via an ARGB layer of tens of KB's. Without
              # PSRAM that sometimes fails, after which LVGL keeps retrying until
              # the watchdog restarts the board. As a sibling on top, no layer
              # is needed and it looks identical.
              - label:
                  id: overlay_icon
                  align: CENTER
                  y: ${OVERLAY_ICON_Y}
                  text_font: materialdesign_icons
                  styles: paint_ink
                  text: "\U000F001B"
                  clickable: false

              - obj:
                  id: overlay_color_button
                  align: BOTTOM_RIGHT
                  x: ${COLOR_KEY_X}
                  y: ${COLOR_KEY_Y}
                  width: ${COLOR_KEY_SIZE}
                  height: ${COLOR_KEY_SIZE}
                  radius: 999
                  hidden: true
                  clickable: true
                  bg_opa: TRANSP
                  border_width: 0
                  pad_left: 0
                  pad_right: 0
                  pad_top: 0
                  pad_bottom: 0
                  scrollable: false
                  scrollbar_mode: 'OFF'
                  on_click:
                    - script.execute: open_color_detail
                  widgets:
                    - arc:
                        align: CENTER
                        width: ${COLOR_ARC_SIZE}
                        height: ${COLOR_ARC_SIZE}
                        start_angle: 0
                        end_angle: 45
                        min_value: 0
                        max_value: 100
                        value: 0
                        adjustable: false
                        arc_width: ${COLOR_ARC_W}
                        arc_rounded: false
                        arc_color: 0xFF3B30
                        arc_opa: COVER
                        bg_opa: TRANSP
                        border_width: 0
                        clickable: false
                        indicator:
                          arc_opa: TRANSP
                        knob:
                          bg_opa: TRANSP
                          border_width: 0
                    - arc:
                        align: CENTER
                        width: ${COLOR_ARC_SIZE}
                        height: ${COLOR_ARC_SIZE}
                        start_angle: 45
                        end_angle: 90
                        min_value: 0
                        max_value: 100
                        value: 0
                        adjustable: false
                        arc_width: ${COLOR_ARC_W}
                        arc_rounded: false
                        arc_color: 0xFF9500
                        arc_opa: COVER
                        bg_opa: TRANSP
                        border_width: 0
                        clickable: false
                        indicator:
                          arc_opa: TRANSP
                        knob:
                          bg_opa: TRANSP
                          border_width: 0
                    - arc:
                        align: CENTER
                        width: ${COLOR_ARC_SIZE}
                        height: ${COLOR_ARC_SIZE}
                        start_angle: 90
                        end_angle: 135
                        min_value: 0
                        max_value: 100
                        value: 0
                        adjustable: false
                        arc_width: ${COLOR_ARC_W}
                        arc_rounded: false
                        arc_color: 0xFFD60A
                        arc_opa: COVER
                        bg_opa: TRANSP
                        border_width: 0
                        clickable: false
                        indicator:
                          arc_opa: TRANSP
                        knob:
                          bg_opa: TRANSP
                          border_width: 0
                    - arc:
                        align: CENTER
                        width: ${COLOR_ARC_SIZE}
                        height: ${COLOR_ARC_SIZE}
                        start_angle: 135
                        end_angle: 180
                        min_value: 0
                        max_value: 100
                        value: 0
                        adjustable: false
