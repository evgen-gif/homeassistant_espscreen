            id: busy_spinner_seed
            hidden: true
            width: 2
            height: 2
            spin_time: 1s
            arc_length: 60deg
        # Never shown either: it makes ESPHome compile LVGL's roller, the drum a light's effects page picks from
        # (firmware 0.2.70+).
        - roller:
            id: roller_seed
            hidden: true
            width: 2
            height: 2
            options: ["-"]
        - label:
            id: lbl_room
            x: ${HEADER_INSET}
            y: ${HEADER_Y}
            text: "${ROOM_NAME}"
