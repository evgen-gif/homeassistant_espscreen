              # ---------- TILE 7 — Table lamp ----------
              # Brightness-only lamp: deliberately no percentage/cover/climate
              # sensors were created for this tile, those would only cost
              # HA subscriptions and heap. The overlay therefore gets
              # NAN / "" for the fields a light never uses.
              - obj:
                  id: tile7
                  hidden: true
                  x: ${GRID_COL1_X}
                  y: ${GRID_ROW4_Y}
                  width: ${TILE_W}
                  height: ${TILE_H}
                  styles: style_tile
                  scrollable: false
