# ESP Screens - the package a Guition ESP32-S3-4848S040 builds from over GitHub. ESP Screen Manager writes every
# screen's own YAML with `packages: display: {url: <this repository>, files: [packages/guition.yaml]}` and adds
# the name, the Wi-Fi reference and the unique keys (docs/EASY_SETUP.md); nothing of that lives here.
#
# The screen is two packages: core.yaml, which every board shares (the LVGL tree, the cards, the scripts, the
# entities), and boards/panel7-jc1060p470c.yaml with this board's hardware and sizes. docs/PROFILES.md says how
# the files fit together. guition-4848s040.yaml builds the same two files from a checkout.
substitutions:
  FONT_DIR: "https://raw.githubusercontent.com/evgen-gif/homeassistant_espscreen/main/fonts"

packages:
  core: !include core.yaml
  board: !include boards/panel7-jc1060p470c.yaml

external_components:
  - source:
      type: git
      url: https://github.com/evgen-gif/homeassistant_espscreen.git
      ref: main
      path: components
    refresh: 0s
    components: [smart_display]
