script:
  - id: ui_self_test
    mode: single
    then:
      - logger.log:
          format: "UI_TEST START: page/overlay render stress, no HA actions"
          level: INFO  # the core logs from INFO; logger.log is DEBUG by default
      - lambda: 'ESP_LOGI("ui_test", "Light sliders: %s", light_controls::self_test() ? "PASS" : "FAIL");'
      - lambda: 'id(calibration_active) = false;'
      - lvgl.page.show: home_page
      - script.execute: wake_display
      - repeat:
          count: 10
          then:
            - lambda: |-
                id(last_touch_ms) = millis();
                id(last_use_ms) = millis();
                static unsigned test_page=0;
                id(tile_page) = runtime_tiles::enabled ? test_page++ % runtime_tiles::page_count() : 1;
            - script.execute: show_tile_page
            - delay: 300ms
            - lambda: |-
                lv_obj_update_layout(id(tile_scroll));
                const int count = runtime_tiles::model.count;
                // Wide cards take two slots, so visibility follows the runtime packing.
                const bool paginated = runtime_tiles::enabled ? runtime_tiles::page_count() > 1 : count > 6;
                lv_obj_t* tiles[] = {id(tile1), id(tile2), id(tile3), id(tile4), id(tile5),
                                     id(tile6), id(tile7), id(tile8), id(tile9), id(tile10)};
                bool ok = guition::check_geometry(id(home_page)->obj);
                for (int i = 0; i < 10; ++i) {
                  bool visible = runtime_tiles::enabled ? i<6 && runtime_tiles::widgets[i].index<runtime_tiles::model.count : i < count && (paginated ? i >= 6 : i < 6);
                  ok = ok && (lv_obj_has_flag(tiles[i], LV_OBJ_FLAG_HIDDEN) != visible);
                }
                // The bar shows with more than one page, unless the Page buttons setting is off (firmware 0.2.69+).
                const bool bar = paginated && (!runtime_tiles::enabled || settings_screen::page_buttons);
                for (lv_obj_t* control : {id(page_prev), id(page_next), id(page_number)})
                  ok = ok && (lv_obj_has_flag(control, LV_OBJ_FLAG_HIDDEN) != bar);
                lv_area_t nav, grid;
                lv_obj_get_coords(id(page_next), &nav);
                lv_obj_get_coords(id(tile_scroll), &grid);
                ok = ok && (!bar || grid.y2 < nav.y1);
                if(runtime_tiles::enabled)ok = runtime_tiles::check_tile_geometry() && ok;
                ESP_LOGI("ui_test", "page_check=%s count=%d heap=%u frames=%u grid_bottom=%d nav_top=%d", ok ? "PASS" : "FAIL", count, (unsigned) esp_get_free_heap_size(), (unsigned) id(rendered_frames), grid.y2, nav.y1);
                id(tile_page) = 0;
            - script.execute: show_tile_page
            - delay: 150ms
            - lvgl.widget.show: brightness_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(brightness_overlay));
            - lvgl.widget.hide: brightness_overlay
            - lvgl.widget.show: color_detail_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(color_detail_overlay));
            - lvgl.widget.hide: color_detail_overlay
            - lvgl.widget.show: climate_detail_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(climate_detail_overlay));
            - lvgl.widget.hide: climate_detail_overlay
            - lvgl.widget.show: climate_mode_overlay
            - delay: 150ms
            - lambda: guition::check_geometry(id(climate_mode_overlay));
            - lvgl.widget.hide: climate_mode_overlay
            - lvgl.widget.show: alert_overlay
            - delay: 150ms
            - lvgl.widget.hide: alert_overlay
      - lambda: 'if (!id(ui_refresh).is_running()) id(ui_refresh).execute();'
      - logger.log:
          format: "UI_TEST COMPLETE"
          level: INFO

  # The two scripts that drive the backlight through set_backlight; the CYD drives it as a light action.
  - id: alert_dismiss
    parameters:
      reason: string
    then:
      - if:
          condition:
            lambda: 'return id(alert_active);'
          then:
            - lambda: |-
                id(alert_active) = false;
                id(last_touch_ms) = millis();
                runtime_tiles::alert_clear();
                ESP_LOGI("alert", "dismissed: %s", reason.c_str());
            - lvgl.widget.hide: alert_overlay
            - script.stop: alert_timeout
            - script.stop: alert_flash
            - lambda: 'id(set_backlight).execute(screen_settings::current.brightness, 80);'
            - script.execute:
                id: alert_report
                action: !lambda 'return reason;'

  # Four backlight blinks when the alert arrives; the screen then stays on as usual.
  - id: alert_flash
    mode: restart
    then:
      - repeat:
          count: 4
          then:
            - lambda: 'id(set_backlight).execute(0, 60);'
            - delay: 140ms
            - lambda: 'id(set_backlight).execute(screen_settings::current.brightness, 60);'
            - delay: 180ms

  - id: wake_display
    mode: restart
    then:
      - lambda: |-
          id(last_touch_ms) = millis();
          id(display_dimmed) = false;
          id(sleep_requested) = false;
          // Almost instant brightness-up. ESPHome's default is 1s, and that feels sluggish
          // when you touch the screen and are waiting on light.
          id(set_backlight).execute(screen_settings::current.brightness, 80);
      - lvgl.widget.hide: dim_wake_overlay
      - script.execute: close_cards

  # One owner for the backlight level, through ESPHome's own light transition (firmware 0.2.57+). Firmware 0.2.13-0.2.56
  # stepped the duty with the LEDC hardware fader by reaching into ESPHome's LEDC output, which ESPHome 2026.8 made final;
  # a new call interrupts the running transition from where it is, as ESPHome does for any light.
  - id: set_backlight
    mode: restart
    parameters:
      level: int
      ms: int
    then:
      - lambda: id(back_light).turn_on().set_transition_length(ms).set_brightness(level / 100.0f).perform();

  # The climate card at this size, with the fan and swing card (the CYD has its own copy).
  - id: climate_card_refresh
    then:
      - lambda: |-
          auto lower = [](std::string v) {
            for (char &c : v) { if (c >= 'A' && c <= 'Z') c = (char)(c - 'A' + 'a'); }
            return v;
          };
          std::string mode = lower(id(active_climate_mode));
          bool off = mode == "off" || mode.empty() || mode == "unknown" || mode == "unavailable";
          // What the device does (Heating), else its mode (Heat); then the room.
          std::string status = off ? std::string(screen_text::tr(screen_text::txt::ha_off)) : std::string(tile_controls::climate_action_text(lower(id(active_climate_action))));
          if (status.empty()) status = tile_controls::climate_mode_text(mode);
          if (std::isfinite(id(active_climate_current))) status += " · " + screen_text::fill(screen_text::txt::climate_now, "value", screen_text::decimal(id(active_climate_current), 1) + "°");
          if (id(active_climate_humidity) >= 0) status += " · " + screen_text::percent(id(active_climate_humidity));
          lv_label_set_text(id(climate_current_label), status.c_str());

          int target = id(active_climate_target_x10);
          std::string value = id(active_climate_target_known)
              ? tile_controls::format_value(target / 10.0f, id(active_climate_step_x10) / 10.0f, "°") : std::string("--");
          lv_label_set_text(id(climate_target_label), value.c_str());
          lv_obj_set_style_text_color(id(climate_target_label), theme::color(off ? theme::OFF : theme::INK), LV_PART_MAIN);
          auto enable = [](lv_obj_t *key, bool on) {
            if (on) lv_obj_remove_state(key, LV_STATE_DISABLED); else lv_obj_add_state(key, LV_STATE_DISABLED);
          };
          enable(id(climate_minus_button), !id(active_climate_target_known) || target > id(active_climate_min_x10));
          enable(id(climate_plus_button), !id(active_climate_target_known) || target < id(active_climate_max_x10));

          // One key per supported mode, in Home Assistant's order. Fan and swing add "more"; with it
          // five mode keys fit, and when a sixth mode is in use it takes the last place.
          std::string supported = lower(id(active_climate_supported_modes));
          auto has = [&](const char *m) {
            return supported.find(std::string("\"") + m + "\"") != std::string::npos ||
                   supported.find(std::string("'") + m + "'") != std::string::npos;
          };
          struct Key { lv_obj_t *obj; const char *mode; };
          const Key keys[] = {{id(cmkey_auto), "auto"}, {id(cmkey_heat_cool), "heat_cool"}, {id(cmkey_heat), "heat"},
                              {id(cmkey_cool), "cool"}, {id(cmkey_dry), "dry"}, {id(cmkey_fan_only), "fan_only"}};
          // The Guition shows fan and swing on their own card below, so no "more" key.
          bool more = false;
          const Key *visible[6];
          unsigned count = 0, room = more ? 5 : 6;
          for (const auto &k : keys) if (has(k.mode)) visible[count++] = &k;
          if (count > room) {
            for (unsigned i = room; i < count; ++i) if (mode == visible[i]->mode) visible[room - 1] = visible[i];
            count = room;
          }
          for (const auto &k : keys) {
            bool show = false;
            for (unsigned i = 0; i < count; ++i) show = show || visible[i] == &k;
            if (show) lv_obj_remove_flag(k.obj, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(k.obj, LV_OBJ_FLAG_HIDDEN);
            bool selected = show && !off && mode == k.mode;
            uint32_t color = tile_controls::mode_color(k.mode);
            lv_obj_set_style_bg_color(k.obj, selected ? lv_color_hex(color) : theme::color(theme::CARD), LV_PART_MAIN);
            lv_obj_set_style_border_color(k.obj, selected ? lv_color_hex(color) : theme::color(theme::LINE), LV_PART_MAIN);
            lv_obj_set_style_text_color(lv_obj_get_child(k.obj, 0), theme::color(selected ? theme::ON_ACCENT : theme::SLATE), LV_PART_MAIN);
          }
          if (more) lv_obj_remove_flag(id(cmkey_more), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(cmkey_more), LV_OBJ_FLAG_HIDDEN);
          // One mode is no choice: the power key already turns it on and off.
          const bool show_keys = count > 1 || more;
          if (show_keys) lv_obj_remove_flag(id(climate_mode_keys), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(climate_mode_keys), LV_OBJ_FLAG_HIDDEN);

          // Fan and swing rows, in the entity's own names and order.
          climate_card::Row settings[2];
          int rows = 0;
          if (!cyd::list_item(id(active_climate_fan_modes), 0).empty())
            settings[rows++] = {'f', "\U000F0210", id(active_climate_fan_modes), id(active_climate_fan_mode)};
          if (!cyd::list_item(id(active_climate_swing_modes), 0).empty())
            settings[rows++] = {'s', "\U000F1C91", id(active_climate_swing_modes), id(active_climate_swing_mode)};
          // One layout per card: the setpoint gives room to the mode keys and the settings below it,
          // and a card with nothing below keeps the setpoint centred.
          static int laid_out = -1;
          if (laid_out != rows * 2 + show_keys) {
            laid_out = rows * 2 + show_keys;
            struct Layout { int status, card_y, card_h, key, number_y, caption_y, modes_y, modes_h, settings_y, edge, row_h, gap; };
            static const Layout layouts[6] = {
              // no mode keys: 0, 1, 2 rows
              {92, 180, 200, 116, -14, 46, 0, 0, 0, 14, 48, 10},
              {92, 140, 200, 116, -14, 46, 0, 0, 364, 14, 48, 10},
              {90, 130, 180, 108, -12, 42, 0, 0, 330, 14, 46, 10},
              // mode keys: 0, 1, 2 rows
              {92, 136, 200, 116, -14, 46, 364, 76, 0, 14, 48, 10},
              {90, 126, 170, 108, -12, 42, 312, 68, 394, 12, 44, 8},
              {86, 118, 140, 96, -10, 36, 270, 60, 342, 12, 42, 8},
            };
            const Layout &l = layouts[(show_keys ? 3 : 0) + rows];
            lv_obj_set_y(id(climate_current_label), l.status);
            lv_obj_set_y(id(climate_setpoint_card), l.card_y);
            lv_obj_set_height(id(climate_setpoint_card), l.card_h);
            for (lv_obj_t *button : {id(climate_minus_button), id(climate_plus_button)}) {
              lv_obj_set_size(button, l.key, l.key);
              lv_obj_set_style_radius(button, l.key / 2, LV_PART_MAIN);
            }
            lv_obj_set_y(id(climate_target_label), l.number_y);
            lv_obj_set_y(id(climate_set_label), l.caption_y);
            if (show_keys) {
              lv_obj_set_y(id(climate_mode_keys), l.modes_y);
              lv_obj_set_height(id(climate_mode_keys), l.modes_h);
              for (lv_obj_t *mode_key : {id(cmkey_auto), id(cmkey_heat_cool), id(cmkey_heat), id(cmkey_cool), id(cmkey_dry), id(cmkey_fan_only), id(cmkey_more)}) {
                lv_obj_set_height(mode_key, l.modes_h);
                lv_obj_set_style_radius(mode_key, l.modes_h / 2, LV_PART_MAIN);
              }
            }
            lv_obj_set_y(id(climate_settings_card), l.settings_y);
            climate_card::look.edge = l.edge;
            climate_card::look.row_h = l.row_h;
            climate_card::look.gap = l.gap;
          }
          climate_card::show(settings, rows);
          id(climate_power_refresh).execute();
